          return true;
        });
      }
      setInsights(list);
    } catch (e) {
      addToast(e.message, 'err');
    } finally {
      setLoading(false);
    }
  }, [selectedCase, cases, setInsights, addToast]);

  useEffect(() => {
    fetchInsights();
  }, [fetchInsights]);

  const filteredInsights = useMemo(() => {
    if (!severityFilter) return insights;
    return (insights || []).filter(i => (i.severity || '').toUpperCase() === severityFilter);
  }, [insights, severityFilter]);

  return (
    <div>
      <div className="card">
        <div className="card-header">
          <div className="card-title">Automated Forensic Detectors</div>
          <div className="row" style={{gap:'10px', flexWrap:'wrap'}}>
            <div className="field" style={{minWidth:'200px'}}>
              <select className="control" value={selectedCase} onChange={e => setSelectedCase(e.target.value)}>
                <option value="">All Ingested Cases</option>
                <option value="__DELTA__">Cross-Case Delta Insights Only</option>
                {cases.map(c => <option key={c.case_id} value={c.case_id}>Case: {esc(c.case_name || c.case_id)}</option>)}
              </select>
            </div>
            <select className="control" value={severityFilter} onChange={e => setSeverityFilter(e.target.value)} style={{maxWidth:'160px'}}>
              <option value="">All Severities</option>
              <option value="CRITICAL">CRITICAL</option>
              <option value="HIGH">HIGH</option>
              <option value="MEDIUM">MEDIUM</option>
              <option value="LOW">LOW</option>
            </select>
            <button className="neu-btn primary" onClick={() => {
              if (selectedCase && selectedCase !== '__DELTA__') {
                const cObj = cases.find(c => c.case_id === selectedCase);
                openAiDossier(selectedCase, cObj?.case_name || selectedCase);
              } else if (cases.length) {
                openAiDossier(cases[0].case_id, cases[0].case_name || cases[0].case_id);
              } else {
                addToast('Please select a case to generate AI Dossier', 'info');
              }
            }} style={{display:'inline-flex', alignItems:'center', gap:'6px'}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
              ✨ AI Dossier
            </button>
          </div>
        </div>
      </div>

      {loading ? (
        <div><div className="skeleton sk-row"></div><div className="skeleton sk-row"></div></div>
      ) : !filteredInsights || !filteredInsights.length ? (
        <div className="empty">
          <svg viewBox="0 0 24 24" fill="none" strokeWidth="2"><path d="M12 3l1.9 5.6L19 10l-5.1 1.9L12 17.5l-1.9-5.6L5 10l5.1-1.4L12 3Z"/></svg>
          No pattern insights match the selected filter. Ingest additional cases or communications to trigger detection.
        </div>
      ) : (
        <div className="cards-grid" style={{gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))'}}>
          {filteredInsights.map(i => {
            const sev = (i.severity || 'MEDIUM').toUpperCase();
            const sevClass = sev === 'CRITICAL' ? 'crit' : sev === 'HIGH' ? 'high' : sev === 'MEDIUM' ? 'med' : 'low';
            return (
              <div key={i.insight_id} className="card" style={{marginBottom:0, display:'flex', flexDirection:'column'}}>
                <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:'8px', marginBottom:'12px'}}>
                  <span className={`tag ${sevClass}`}>{sev}</span>
                  <span className="mono" style={{fontSize:'11px', color:'var(--text-faint)'}}>{esc(i.insight_type)}</span>
                </div>
                <div style={{fontWeight:700, fontSize:'15px', marginBottom:'8px', color:'var(--text)'}}>{esc(i.title)}</div>
                <div style={{fontSize:'13px', color:'var(--text-dim)', marginBottom:'14px', flex:1, lineHeight:1.5}}>{esc(i.derived_interpretation)}</div>
                {(i.observed_facts || []).slice(0, 2).map((f, idx) => (
                  <div key={idx} style={{fontSize:'12px', color:'var(--text-faint)', display:'flex', gap:'6px', marginBottom:'4px'}}>
                    <span style={{color:'var(--accent)'}}>●</span> {esc(f)}
                  </div>
                ))}
                <div style={{marginTop:'14px', display:'flex', gap:'6px', flexWrap:'wrap'}}>
                  {(i.case_ids || []).map(c => <span key={c} className="tag plain mono">{esc(c)}</span>)}
                </div>
                <button className="neu-btn ghost" style={{marginTop:'14px', width:'100%'}} onClick={() => setSelectedInsight(i)}>Examine Evidence</button>
              </div>
            );
          })}
        </div>
      )}

      {selectedInsight && (
        <div className="modal-overlay open" onClick={() => setSelectedInsight(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <button className="close neu-btn ghost" onClick={() => setSelectedInsight(null)} style={{float:'right'}}>✕</button>
            <div style={{display:'flex', alignItems:'center', gap:'10px', marginBottom:'10px'}}>
              <span className={`tag ${(selectedInsight.severity||'med').toLowerCase()}`}>{esc(selectedInsight.severity)}</span>
              <span className="tag plain mono">{esc(selectedInsight.insight_type)} · {esc(selectedInsight.insight_id)}</span>
            </div>
            <h3>{esc(selectedInsight.title)}</h3>
            <div style={{fontSize:'14.5px', color:'var(--text)', marginBottom:'18px', lineHeight:1.6}}>{esc(selectedInsight.derived_interpretation)}</div>
            <div style={{fontWeight:700, fontSize:'13.5px', marginBottom:'8px'}}>Observed Graph Facts</div>
            {(selectedInsight.observed_facts || []).map((f, idx) => (
              <div key={idx} style={{fontSize:'13px', color:'var(--text-dim)', marginBottom:'6px', display:'flex', gap:'8px'}}>
                <span style={{color:'var(--accent)'}}>➔</span> {esc(f)}
              </div>
            ))}
            {(selectedInsight.alternative_explanations || []).length > 0 && (
              <React.Fragment>
                <div style={{fontWeight:700, fontSize:'13.5px', margin:'18px 0 8px'}}>Alternative Explanations</div>
                {selectedInsight.alternative_explanations.map((a, idx) => <div key={idx} style={{fontSize:'13px', color:'var(--text-faint)', marginBottom:'4px'}}>· {esc(a)}</div>)}
              </React.Fragment>
            )}
            <div style={{marginTop:'20px', padding:'12px', borderRadius:'10px', background:'var(--bg1)', border:'1px solid var(--border)', fontSize:'12px', color:'var(--text-faint)'}}>
              {esc(selectedInsight.disclaimer || 'Intelligence alert generated automatically from graph topology.')}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Sub-Module: Chain of Custody (Blockchain) ----------
function BlockchainModule({ cases, fetchCases, addToast }) {
  const [blocks, setBlocks] = useState([]);
  const [search, setSearch] = useState('');
  const [expandedCases, setExpandedCases] = useState(new Set());
  const [loading, setLoading] = useState(false);
  const [auditing, setAuditing] = useState(false);
  const [liveAuditMap, setLiveAuditMap] = useState({});

  const fetchLedger = useCallback(async () => {
    setLoading(true);
    try {
      if (!cases.length) await fetchCases();
      const data = await API.get('/api/v1/blockchain/ledger');
      setBlocks(data.blocks || []);
    } catch (e) {
      addToast(e.message, 'err');
    } finally {
      setLoading(false);
    }
  }, [cases.length, fetchCases, addToast]);

  useEffect(() => {
    fetchLedger();
  }, [fetchLedger]);

  const toggleCaseExpand = (cid) => {
    setExpandedCases(prev => {
      const next = new Set(prev);
      if (next.has(cid)) next.delete(cid);
      else next.add(cid);
      return next;
    });
  };

  const expandAll = (expand) => {
    if (expand) {
      const ids = [...new Set(blocks.map(b => b.case_id))];
      setExpandedCases(new Set(ids));
    } else {
      setExpandedCases(new Set());
    }
  };

  // Grouping
  const caseMap = useMemo(() => {
    const map = {};
    blocks.forEach(b => {
      const cid = b.case_id || 'UNKNOWN';
      if (cid === 'SYSTEM_GENESIS' || b.document_type === 'SYSTEM_GENESIS') return;
      if (!map[cid]) map[cid] = [];
      map[cid].push(b);
    });
    return map;
  }, [blocks]);

  const caseIds = useMemo(() => {
    const regIds = cases.map(c => c.case_id).filter(id => id && id !== 'SYSTEM_GENESIS');
    const ledIds = Object.keys(caseMap).filter(id => id !== 'SYSTEM_GENESIS');
    return [...new Set([...regIds, ...ledIds])].sort();
  }, [cases, caseMap]);

  // Live Audit execution
  const runLiveAudit = useCallback(async () => {
    if (!caseIds.length) return;
    setAuditing(true);
    try {
      const results = {};
      await Promise.all(caseIds.map(async (cid) => {
        try {
          const res = await API.get(`/api/v1/blockchain/verify-case/${encodeURIComponent(cid)}`);
          results[cid] = res;
        } catch (e) {
          results[cid] = { status: 'ERROR', message: e.message };
        }
      }));
      setLiveAuditMap(results);
    } catch (e) {
      addToast(`Live audit error: ${e.message}`, 'err');
    } finally {
      setAuditing(false);
    }
  }, [caseIds, addToast]);

  useEffect(() => {
    if (caseIds.length > 0) {
      runLiveAudit();
    }
  }, [caseIds.length, runLiveAudit]);

  const totalLedgerTampered = useMemo(() => blocks.filter(b => b.is_valid === false).length, [blocks]);
  const totalLiveTamperedCases = useMemo(() => {
    return Object.values(liveAuditMap).filter(a => a.status === 'TAMPERED').length;
  }, [liveAuditMap]);

  const filteredCaseIds = useMemo(() => {
    const q = search.toLowerCase().trim();
    if (!q) return caseIds;
    return caseIds.filter(cid => {
      const cObj = cases.find(c => c.case_id === cid);
      const cName = cObj?.case_name || cid;
      if (cid.toLowerCase().includes(q) || cName.toLowerCase().includes(q)) return true;
      const caseBlocks = caseMap[cid] || [];
      return caseBlocks.some(b => 
        (b.document_name || '').toLowerCase().includes(q) || 
        (b.document_type || '').toLowerCase().includes(q) ||
        (b.evidence_hash || '').toLowerCase().includes(q)
      );
    });
  }, [caseIds, cases, caseMap, search]);

  const docIconMap = { FIR: '📜', CDR_LOG: '📞', BANK_STATEMENT: '💳', SURVEILLANCE_LOG: '📹', INTEL_REPORT: '📄', CASE_MASTER: '📂' };

  return (
    <div>
      <div className="card">
        <div className="card-header">
          <div className="card-title">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--accent)" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Blockchain Evidence Chain of Custody
          </div>
          <div className="row" style={{gap:'10px'}}>
            <div className="field" style={{minWidth:'260px'}}>
              <input className="control" value={search} onChange={e => setSearch(e.target.value)} placeholder="Search case ID or document..." />
            </div>
            <button className="neu-btn primary" onClick={() => { fetchLedger(); runLiveAudit(); }} disabled={loading || auditing}>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
              {auditing ? 'Auditing Database…' : 'Run Verification Audit'}
            </button>
          </div>
        </div>
        <div className="cards-grid" style={{gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', marginTop:'10px'}}>
          <div className="stat-card" style={{'--glow': (totalLedgerTampered > 0 || totalLiveTamperedCases > 0) ? 'rgba(239, 68, 68, 0.3)' : 'rgba(16, 185, 129, 0.2)'}}>
            <div className="stat-label">Chain-of-Custody Status</div>
            <div className="stat-value" style={{fontSize:'18px', marginTop:'14px', color: (totalLedgerTampered > 0 || totalLiveTamperedCases > 0) ? '#ef4444' : '#10b981'}}>
              {(totalLedgerTampered > 0 || totalLiveTamperedCases > 0) ? `🔴 ${totalLiveTamperedCases || totalLedgerTampered} TAMPERED DETECTED` : '🟢 100% VERIFIED'}
            </div>
          </div>
          <div className="stat-card" style={{'--glow': 'rgba(99, 102, 241, 0.2)'}}>
            <div className="stat-label">Encryption & Proof</div>
            <div className="stat-value" style={{fontSize:'18px', marginTop:'14px'}}>SHA-256 Merkle Proof</div>
          </div>
          <div className="stat-card" style={{'--glow': 'rgba(6, 182, 212, 0.2)'}}>
            <div className="stat-label">Live Database Audit</div>
            <div className="stat-value" style={{fontSize:'18px', marginTop:'14px', color: totalLiveTamperedCases > 0 ? '#ef4444' : 'var(--accent)'}}>
              {auditing ? 'Auditing Graph…' : totalLiveTamperedCases > 0 ? `${totalLiveTamperedCases} Case Mismatch` : 'Neo4j Graph Synced'}
            </div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-header">
          <div className="card-title">Investigation Cases & Evidence Verification</div>
          <div style={{display:'flex', gap:'10px', alignItems:'center'}}>
            <button className="neu-btn ghost" style={{padding:'4px 10px', fontSize:'11.5px'}} onClick={() => expandAll(true)}>Expand All</button>
            <button className="neu-btn ghost" style={{padding:'4px 10px', fontSize:'11.5px'}} onClick={() => expandAll(false)}>Collapse All</button>
            <span className="tag plain">{filteredCaseIds.length} Cases</span>
          </div>
        </div>

        {loading ? (
          <div className="skeleton sk-row"></div>
        ) : !filteredCaseIds.length ? (
          <div className="empty">No blockchain cases recorded matching filter query.</div>
        ) : (
          <div style={{display:'flex', flexDirection:'column', gap:'12px', marginTop:'10px'}}>
            {filteredCaseIds.map(cid => {
              const caseBlocks = caseMap[cid] || [];
              const cObj = cases.find(c => c.case_id === cid);
              const caseName = cObj?.case_name || cid;
              const liveAudit = liveAuditMap[cid];
              const isBlockTampered = caseBlocks.some(b => b.is_valid === false);
              const isLiveTampered = liveAudit && liveAudit.status === 'TAMPERED';
              const isTampered = isBlockTampered || isLiveTampered;
              const isExpanded = expandedCases.has(cid);

              return (
                <div key={cid} className="card" style={{marginBottom:0, border: isTampered ? '1px solid rgba(239,68,68,0.5)' : '1px solid var(--border)'}}>
                  <div style={{display:'flex', alignItems:'center', justify: 'space-between', cursor:'pointer', userSelect:'none'}} onClick={() => toggleCaseExpand(cid)}>
                    <div style={{display:'flex', alignItems:'center', gap:'12px'}}>
                      <span style={{fontSize:'20px', color: isTampered ? '#ef4444' : 'var(--accent)'}}>📁</span>
                      <div>
                        <div style={{fontWeight:700, fontSize:'15px', color:'var(--text)'}}>{esc(caseName)}</div>
                        <div className="mono" style={{fontSize:'12px', color:'var(--text-faint)'}}>Case ID: {esc(cid)} · {caseBlocks.length} Document Blocks</div>
                      </div>
                    </div>
                    <div style={{display:'flex', alignItems:'center', gap:'14px'}}>
                      {isTampered ? (
                        <span className="tag crit" style={{background:'rgba(239,68,68,0.2)', color:'#ef4444', border:'1px solid rgba(239,68,68,0.4)', fontWeight:700}}>
                          🔴 {isLiveTampered ? 'DATABASE TAMPERED' : 'BLOCK TAMPERED'}
                        </span>
                      ) : (
                        <span className="tag low" style={{background:'rgba(16,185,129,0.15)', color:'#10b981', border:'1px solid rgba(16,185,129,0.3)', fontWeight:700}}>🟢 VERIFIED</span>
                      )}
                      <span style={{fontSize:'13px', color:'var(--accent)', fontWeight:600}}>{isExpanded ? '▲ Hide Details' : '▼ Audit Verification'}</span>
                    </div>
                  </div>

                  {isExpanded && (
                    <div style={{marginTop:'14px', paddingTop:'14px', borderTop:'1px dashed var(--border)'}}>
                      {/* Live Cryptographic Fingerprint Verification Card */}
                      {liveAudit && (
                        <div style={{marginBottom:'14px', padding:'14px', borderRadius:'12px', background: isLiveTampered ? 'rgba(239,68,68,0.08)' : 'var(--bg1)', border: isLiveTampered ? '1px solid rgba(239,68,68,0.3)' : '1px solid var(--border)'}}>
                          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'8px'}}>
                            <div style={{fontWeight:700, fontSize:'13px', color:'var(--text)'}}>
                              {isLiveTampered ? `🔴 Live Graph Database Tampering Flagged (${(liveAudit.tampered_document_types || []).join(', ') || 'Graph Mismatch'})` : '🟢 Live Neo4j Graph Integrity Proof'}
                            </div>
                            <span className="mono" style={{fontSize:'11px', color:'var(--text-faint)'}}>{liveAudit.verification_timestamp}</span>
                          </div>
                          <div className="cards-grid" style={{gridTemplateColumns:'repeat(auto-fit, minmax(240px, 1fr))', gap:'10px', marginBottom:0}}>
                            <div>
                              <div style={{fontSize:'11px', color:'var(--text-faint)', marginBottom:'2px'}}>On-Chain Recorded Merkle Root:</div>
                              <div className="mono" style={{fontSize:'10.5px', color:'var(--accent)', wordBreak:'break-all', background:'var(--surface)', padding:'6px', borderRadius:'6px', border:'1px solid var(--border)'}}>
                                {esc(liveAudit.merkle_root)}
                              </div>
                            </div>
                            <div>
                              <div style={{fontSize:'11px', color:'var(--text-faint)', marginBottom:'2px'}}>Live Graph Fingerprint Hash:</div>
                              <div className="mono" style={{fontSize:'10.5px', color: isLiveTampered ? '#ef4444' : '#10b981', wordBreak:'break-all', background:'var(--surface)', padding:'6px', borderRadius:'6px', border: isLiveTampered ? '1px solid rgba(239,68,68,0.4)' : '1px solid var(--border)'}}>
                                {esc(liveAudit.graph_fingerprint)}
                              </div>
                            </div>
                          </div>
                          {isLiveTampered && (
                            <div style={{marginTop:'10px', fontSize:'12px', color:'#ef4444', fontWeight:600, display:'flex', alignItems:'center', gap:'6px'}}>
                              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
                              Document Tampering Detected: Live Neo4j records in domain {(liveAudit.tampered_document_types || []).map(t => `'${t}'`).join(', ')} contain modified database fields.
                            </div>
                          )}
                        </div>
                      )}

                      <div style={{fontWeight:700, fontSize:'13px', marginBottom:'10px', color:'var(--text-dim)'}}>Associated Document Evidence Blocks ({caseBlocks.length}):</div>
                      <div className="cards-grid" style={{gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))'}}>
                        {caseBlocks.length ? caseBlocks.map(b => {
                          const isTypeTampered = liveAudit && (liveAudit.tampered_document_types || []).includes(b.document_type);
                          const isBlockValid = b.is_valid !== false;
                          const isValid = isBlockValid && !isTypeTampered;
                          const icon = docIconMap[b.document_type] || '📁';
                          return (
                            <div key={b.document_id || b.index} className="card" style={{marginBottom:0, background:'var(--surface-hover)', border: isValid ? '1px solid var(--border)' : '1px solid rgba(239,68,68,0.4)'}}>
                              <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:'8px', marginBottom:'10px'}}>
                                <span style={{fontSize:'22px'}}>{icon}</span>
                                {isValid ? (
                                  <span className="tag low">VERIFIED</span>
                                ) : (
                                  <span className="tag crit" style={{background:'rgba(239,68,68,0.2)', color:'#ef4444', border:'1px solid rgba(239,68,68,0.4)', fontWeight:700}}>
                                    🔴 {!isBlockValid ? 'BLOCK TAMPERED' : `${b.document_type} DB TAMPERED`}
                                  </span>
                                )}
                              </div>
                              <div style={{fontWeight:700, fontSize:'14px', color:'var(--text)', marginBottom:'4px'}}>{esc(b.document_name || b.document_type)}</div>
                              <div className="mono" style={{fontSize:'11px', color:'var(--text-faint)', marginBottom:'10px'}}>ID: {esc(b.document_id)} · Block #{b.index}</div>
                              <div style={{fontSize:'11px', color:'var(--text-dim)', marginBottom:'4px'}}>Evidence Payload Hash:</div>
                              <div className="mono" style={{fontSize:'10.5px', color: isValid ? 'var(--accent)' : '#ef4444', wordBreak:'break-all', background:'var(--bg1)', padding:'6px', borderRadius:'6px', border:'1px solid var(--border)'}}>
                                {esc(b.evidence_hash)}
                              </div>
                              <div style={{fontSize:'11px', color:'var(--text-faint)', marginTop:'8px', textAlign:'right'}}>{esc(b.formatted_time)}</div>
                            </div>
                          );
                        }) : (
                          <div className="empty" style={{gridColumn:'1/-1'}}>No document evidence blocks logged yet for this case.</div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="card">
        <div className="card-header">
          <div className="card-title">Immutable Block History Ledger</div>
          <span className="tag plain">{blocks.length} Blocks</span>
        </div>
        <div className="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>Block #</th>
                <th>Case ID</th>
                <th>Document Name / Type</th>
                <th>Timestamp</th>
                <th>Evidence Hash (SHA-256)</th>
                <th>Merkle Root</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              {blocks.filter(b => b.case_id !== 'SYSTEM_GENESIS' && b.document_type !== 'SYSTEM_GENESIS').map(b => {
                const isValid = b.is_valid !== false;
                return (
                  <tr key={b.index} style={!isValid ? {background:'rgba(239,68,68,0.06)'} : {}}>
                    <td className="mono"><b>#{b.index}</b></td>
                    <td><span className="tag open mono" style={{cursor:'pointer'}} onClick={() => toggleCaseExpand(b.case_id)}>{esc(b.case_id)}</span></td>
                    <td><b>{esc(b.document_name || b.document_type || 'CASE_MASTER')}</b> <span className="mono" style={{fontSize:'11px', color:'var(--text-faint)'}}>({esc(b.document_type)})</span></td>
                    <td style={{fontSize:'12px', color:'var(--text-dim)'}}>{esc(b.formatted_time)}</td>
                    <td className="mono" style={{fontSize:'11px'}} title={esc(b.evidence_hash)}>{esc(b.evidence_hash?.substring(0, 16))}…</td>
                    <td className="mono" style={{fontSize:'11px'}} title={esc(b.merkle_root)}>{esc(b.merkle_root?.substring(0, 16))}…</td>
                    <td>{isValid ? <span className="tag low">VERIFIED</span> : <span className="tag crit" style={{background:'rgba(239,68,68,0.2)', color:'#ef4444', border:'1px solid rgba(239,68,68,0.4)', fontWeight:700}}>TAMPERED</span>}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ---------- Sub-Module: Case Registry ----------
function CaseRegistryModule({ cases, fetchCases, selectedCase, setSelectedCase, openAiDossier, promptDeleteCase, changeView, theme, addToast }) {
  const [statusFilter, setStatusFilter] = useState('');
  const [caseDetail, setCaseDetail] = useState(null);
  const [loadingDetail, setLoadingDetail] = useState(false);
  const miniGraphRef = useRef(null);

  const filteredCases = useMemo(() => {
    if (!statusFilter) return cases;
    return cases.filter(c => (c.status || '').toUpperCase() === statusFilter.toUpperCase());
  }, [cases, statusFilter]);

  const loadCaseDetail = useCallback(async (id) => {
    setSelectedCase(id);
    setLoadingDetail(true);
    try {
      const c = await API.get(`/api/cases/${encodeURIComponent(id)}`);
      setCaseDetail(c);
    } catch (e) {
      addToast(e.message, 'err');
      setCaseDetail(null);
    } finally {
      setLoadingDetail(false);
    }
  }, [setSelectedCase, addToast]);

  useEffect(() => {
    if (selectedCase) {
      loadCaseDetail(selectedCase);
    }
  }, [selectedCase, loadCaseDetail]);

  // Mini graph visualization inside case detail
  useEffect(() => {
    if (!caseDetail || !miniGraphRef.current || typeof vis === 'undefined' || !vis.Network) return;
    let isMounted = true;
    async function renderMiniGraph() {
      try {
        const g = await API.get(`/api/graph?case_id=${encodeURIComponent(caseDetail.case_id)}&limit=400`);
        if (!isMounted || !miniGraphRef.current) return;

        const isLight = theme === 'light';
        const seenNodeIds = new Set();
        const nodes = [];
        (g.nodes || []).forEach(n => {
          if (n && n.id && !seenNodeIds.has(n.id)) {
            seenNodeIds.add(n.id);
            nodes.push({
              id: n.id, label: n.name || n.id, size: 12, shape: 'dot',
              color: { background: LABEL_COLOR[n.labels?.[0]] || '#94a3b8', border: isLight ? '#ffffff' : '#070a12' },
              font: { color: isLight ? '#0f172a' : '#cbd5e1', size: 11 }
            });
          }
        });

        const seenEdgeIds = new Set();
        const edges = [];
        (g.edges || []).forEach((e, idx) => {
          if (!e || !e.source || !e.target) return;
          let edgeId = String(e.id || `edge_${e.source}_${e.type}_${e.target}_${idx}`);
          if (seenEdgeIds.has(edgeId)) edgeId = `${edgeId}_${idx}`;
          seenEdgeIds.add(edgeId);
          edges.push({
            id: edgeId, from: e.source, to: e.target, arrows: 'to',
            color: { color: isLight ? 'rgba(51, 65, 85, 0.4)' : 'rgba(148, 163, 184, 0.4)' }
          });
        });

        const seed = getDeterministicSeed(caseDetail.case_id);
        new vis.Network(miniGraphRef.current, { nodes, edges }, {
          layout: { randomSeed: seed, improvedLayout: true },
          physics: {
            solver: 'forceAtlas2Based',
            forceAtlas2Based: { gravitationalConstant: -55, centralGravity: 0.015, springLength: 150, springConstant: 0.07, damping: 0.52, avoidOverlap: 0.85 },
            stabilization: { iterations: 140 }
          },
          nodes: { borderWidth: 2 }, edges: { width: 1.2 }
        });
      } catch (e) {}
    }
    renderMiniGraph();
    return () => { isMounted = false; };
  }, [caseDetail, theme]);

  return (
    <div>
      <div className="card">
        <div className="card-header">
          <div className="card-title">Case Registry</div>
          <div className="row" style={{gap:'10px'}}>
            <div className="field" style={{maxWidth:'180px'}}>
              <select className="control" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
                <option value="">All Statuses</option>
                <option>OPEN</option>
                <option>UNDER_INVESTIGATION</option>
                <option>CHARGED</option>
                <option>CLOSED</option>
              </select>
            </div>
            <button className="neu-btn ghost" onClick={fetchCases}>
              <svg viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
              Refresh
            </button>
          </div>
        </div>

        <div className="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>Case Identifier</th>
                <th>Type</th>
                <th>Jurisdiction</th>
                <th>Lead Investigator</th>
                <th>Entities</th>
                <th>Status</th>
                <th>AI Insights</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {!filteredCases.length ? (
                <tr><td colSpan="8"><div className="empty">No cases registered matching criteria.</div></td></tr>
              ) : (
                filteredCases.map(x => (
                  <tr key={x.case_id} style={{cursor:'pointer'}} onClick={() => loadCaseDetail(x.case_id)}>
                    <td>
                      <div style={{fontWeight:700, color:'var(--text)'}}>{esc(x.case_name || x.case_id)}</div>
                      <div className="mono" style={{color:'var(--text-faint)'}}>{esc(x.case_id)}</div>
                    </td>
                    <td>{esc(x.case_type || '—')}</td>
                    <td>{esc(x.jurisdiction || '—')}</td>
                    <td>{esc(x.lead_investigator || '—')}</td>
                    <td className="mono"><b>{x.total_entities}</b></td>
                    <td><span className={`tag ${(x.status || 'open').toLowerCase().includes('close') ? 'closed' : 'open'}`}>{esc(x.status || 'OPEN')}</span></td>
                    <td onClick={e => e.stopPropagation()}>
                      <button className="neu-btn ghost" style={{padding:'4px 9px', fontSize:'11.5px', color:'var(--accent)', display:'inline-flex', alignItems:'center', gap:'6px'}} onClick={() => openAiDossier(x.case_id, x.case_name || x.case_id)}>
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
                        ✨ AI Dossier
                      </button>
                    </td>
                    <td style={{textAlign:'right'}} onClick={e => e.stopPropagation()}>
                      <button className="neu-btn danger" style={{padding:'5px 10px', fontSize:'12px'}} onClick={() => promptDeleteCase(x.case_id, x.case_name || x.case_id)}>
                        Delete
                      </button>
                    </td>
                  </tr>
                ))
              )}

        </div>
      </div>

      {loadingDetail && <div className="skeleton sk-row"></div>}

      {caseDetail && !loadingDetail && (
        <div className="card">
          <div className="card-header">
            <div>
              <div style={{display:'flex', alignItems:'center', gap:'12px'}}>

              <div className="mono" style={{color:'var(--text-faint)', fontSize:'12px', marginTop:'2px'}}>{esc(caseDetail.case_id)}</div>
            </div>
            <div style={{display:'flex', gap:'10px', flexWrap:'wrap'}}>
              <button className="neu-btn primary" onClick={() => openAiDossier(caseDetail.case_id, caseDetail.metadata?.case_name || caseDetail.case_id)}>

                ✨ AI Dossier
              </button>
              <button className="neu-btn ghost" onClick={() => changeView('graph')}>Explore in Graph</button>
              <button className="neu-btn danger" onClick={() => promptDeleteCase(caseDetail.case_id, caseDetail.metadata?.case_name || caseDetail.case_id)}>
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                Delete Case

          </div>

          {caseDetail.metadata?.summary && <div style={{fontSize:'14px', color:'var(--text-dim)', marginBottom:'18px', lineHeight:1.6}}>{esc(caseDetail.metadata.summary)}</div>}

          <div className="kv" style={{gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))'}}>
            {caseDetail.metadata?.case_type && <div><div className="k">Investigation Type</div><div className="v">{esc(caseDetail.metadata.case_type)}</div></div>}
            {caseDetail.metadata?.jurisdiction && <div><div className="k">Jurisdiction</div><div className="v">{esc(caseDetail.metadata.jurisdiction)}</div></div>}
            {caseDetail.metadata?.lead_investigator && <div><div className="k">Lead Investigator</div><div className="v">{esc(caseDetail.metadata.lead_investigator)}</div></div>}
            {caseDetail.metadata?.created_date && <div><div className="k">Date Filed</div><div className="v">{esc(caseDetail.metadata.created_date)}</div></div>}
            <div><div className="k">Total Entities</div><div className="v mono">{caseDetail.total_entities}</div></div>
          </div>

          <div style={{fontWeight:700, fontSize:'14px', margin:'22px 0 10px'}}>Entity Breakdown</div>
          {Object.entries(caseDetail.entity_breakdown || {}).map(([k, v]) => (
            <div key={k} className="list-row">
              <div className="l-name">{esc(k)}</div>
              <span className="tag plain mono">{v}</span>
            </div>
          ))}

          <div style={{marginTop:'20px'}}>
            <div ref={miniGraphRef} style={{height:'360px', borderRadius:'12px', border:'1px solid var(--border)', background:'var(--graph-bg)', overflow:'hidden'}}></div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Sub-Module: Data Ingestion ----------
function DataIngestionModule({ fetchCases, changeView, addToast }) {
  const [dragActive, setDragActive] = useState(false);
  const [rawText, setRawText] = useState('');
  const [ingestResult, setIngestResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const fileInputRef = useRef(null);

  const handleFiles = async (files) => {
    if (!files || !files.length) return;
    const fd = new FormData();
    Array.from(files).forEach(f => fd.append('files', f));

    setLoading(true);
    addToast(`Uploading ${files.length} file(s)…`, 'info');

    try {
      const res = await API.send('/api/v1/ingest', { method: 'POST', body: fd, form: true });
      setIngestResult(res);
      addToast('Data ingested successfully', 'ok');
      fetchCases();
    } catch (e) {
      addToast(`Ingestion failed: ${e.message}`, 'err');
    } finally {
      setLoading(false);
    }
  };

  const handleRawTextIngest = async () => {
    if (!rawText.trim()) { addToast('Please provide narrative text to ingest', 'info'); return; }
    setLoading(true);

    try {
      const res = await API.send('/api/v1/ingest/text', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: rawText.trim(),
        form: false
      });
      setIngestResult(res);
      addToast('Text ingested successfully', 'ok');
      fetchCases();
    } catch (e) {
      addToast(`Ingestion failed: ${e.message}`, 'err');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div>
      <div className="card">
        <div className="card-header"><div className="card-title">Upload Investigation Data Files</div></div>
        <div
          id="dropZone"
          style={{
            display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:'14px', padding:'34px',
            border: dragActive ? '2px dashed var(--accent)' : '2px dashed var(--border)', borderRadius:'var(--radius)', background:'var(--bg1)', transition:'.2s'
          }}
          onDragOver={e => { e.preventDefault(); setDragActive(true); }}
          onDragLeave={() => setDragActive(false)}
          onDrop={e => { e.preventDefault(); setDragActive(false); handleFiles(e.target.files); }}
        >
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" strokeWidth="2" strokeLinecap="round"><path d="M12 5v14m-7-7h14"/><path d="M3 7a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
          <div style={{color:'var(--text-dim)', fontSize:'14px', textAlign:'center'}}>
            Drag & drop structured case JSON, CDR / Telecom CSV, Bank statements, or FIR narratives
          </div>
          <input type="file" ref={fileInputRef} multiple hidden onChange={e => handleFiles(e.target.files)} />
          <button className="neu-btn primary" disabled={loading} onClick={() => fileInputRef.current?.click()}>{loading ? 'Uploading…' : 'Select Files'}</button>
        </div>
      </div>

      <div className="card">
        <div className="card-header"><div className="card-title">Direct Narrative / FIR Text Ingestion</div></div>
        <textarea className="control" rows="6" value={rawText} onChange={e => setRawText(e.target.value)} placeholder="Paste unformatted case narrative, FIR description, or CDR tabular text directly here…" style={{width:'100%', resize:'vertical'}}></textarea>
        <div className="row" style={{marginTop:'14px'}}>
          <button className="neu-btn primary" disabled={loading} onClick={handleRawTextIngest}>{loading ? 'Ingesting…' : 'Ingest Narrative Text'}</button>
        </div>
      </div>

      {ingestResult && (
        <div className="card">
          <div className="card-header"><div className="card-title">Ingestion Summary</div></div>
          <div>
            <div className="cards-grid" style={{gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))'}}>
              <div className="stat-card" style={{'--glow': 'rgba(0, 210, 255, 0.2)'}}>
                <div className="stat-label">Nodes Created</div>
                <div className="stat-value">{ingestResult.created?.nodes || 0}</div>
              </div>
              <div className="stat-card" style={{'--glow': 'rgba(99, 102, 241, 0.2)'}}>
                <div className="stat-label">Relationships</div>
                <div className="stat-value">{ingestResult.created?.relationships || 0}</div>
              </div>
              <div className="stat-card" style={{'--glow': 'rgba(16, 185, 129, 0.2)'}}>
                <div className="stat-label">Source Records</div>
                <div className="stat-value">{ingestResult.created?.source_records || 0}</div>
              </div>
              <div className="stat-card" style={{'--glow': 'rgba(245, 158, 11, 0.2)'}}>
                <div className="stat-label">New Insights</div>
                <div className="stat-value">{ingestResult.new_insights || 0}</div>
              </div>
            </div>

            <div style={{display:'flex', gap:'10px', flexWrap:'wrap', margin:'10px 0 16px'}}>
              <span className="tag open">Case {esc(ingestResult.case_id)}</span>
              <span className="tag plain">Matched Existing: {ingestResult.matched_existing_entities || 0}</span>
              <span className="tag plain">Cross-Case Links: {ingestResult.new_cross_case_links || 0}</span>
            </div>

            {(ingestResult.warnings || []).length > 0 && (
              <div style={{background:'rgba(245,158,11,0.1)', border:'1px solid rgba(245,158,11,0.25)', padding:'12px 16px', borderRadius:'12px', fontSize:'13px', color:'var(--amber)', marginBottom:'14px'}}>
                {ingestResult.warnings.map((w, idx) => <div key={idx}>⚠ {esc(w)}</div>)}
              </div>
            )}

            <div style={{display:'flex', gap:'10px'}}>
              <button className="neu-btn primary" onClick={() => changeView('insights')}>Review Generated Insights</button>
              <button className="neu-btn ghost" onClick={() => changeView('cases')}>View in Case Registry</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Modal Content Components ----------
function EntityModalContent({ data, onClose, openEntityModal }) {
  const p = data.properties || {};
  const keys = Object.keys(p).filter(k => !['case_ids', 'created_at', 'updated_at'].includes(k));

  return (
    <React.Fragment>
      <button className="close neu-btn ghost" onClick={onClose} style={{float:'right'}}>✕</button>
      <h3>{esc(data.labels?.[0] || 'Entity')} · {esc(data.entity_id)}</h3>
      <div style={{display:'flex', gap:'18px', alignItems:'center', marginBottom:'18px'}}>
        <div className="stat-card" style={{minWidth:'130px', padding:'14px', '--glow': 'rgba(0, 210, 255, 0.2)'}}>
          <div className="stat-value" style={{fontSize:'24px'}}>{data.total_connections}</div>
          <div className="stat-label">Direct Connections</div>
        </div>
        <div style={{fontSize:'13px', color:'var(--text-dim)'}}>
          Full entity record with immediate 1-hop associations across all linked investigation files.
        </div>
      </div>
      <div style={{fontWeight:700, fontSize:'14px', margin:'12px 0 6px'}}>Stored Attributes</div>
      <div className="kv">
        {keys.length ? keys.map(k => (
          <div key={k}>
            <div className="k">{esc(k)}</div>
            <div className="v mono">{esc(typeof p[k] === 'object' ? JSON.stringify(p[k]) : p[k])}</div>
          </div>
        )) : <div style={{gridColumn:'1/-1', color:'var(--text-faint)'}}>No attributes available</div>}
      </div>
      <div style={{fontWeight:700, fontSize:'14px', margin:'20px 0 8px'}}>Connected Entities ({data.total_connections})</div>
      {(data.connections || []).length ? data.connections.map(c => (
        <div key={c.neighbor_id} className="result-item" style={{cursor:'default'}}>
          <div className="result-main">
            <div className="result-name">{esc(c.neighbor_name || c.neighbor_id)}</div>
            <div className="result-sub">{c.direction === 'OUTGOING' ? '→ OUTGOING' : '← INCOMING'} · <span className="tag plain">{esc(c.relationship)}</span></div>
          </div>
          <div style={{display:'flex', alignItems:'center', gap:'8px'}}>
            <span className="tag plain">{(c.neighbor_labels || []).join(', ')}</span>
            <button className="neu-btn ghost" style={{padding:'4px 8px', fontSize:'11px'}} onClick={() => { onClose(); openEntityModal(c.neighbor_id); }}>Inspect</button>
          </div>
        </div>
      )) : <div className="empty">No direct 1-hop connections registered.</div>}
    </React.Fragment>
  );
}

function AiDossierModalContent({ caseId, caseName, onClose }) {

  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

    let isMounted = true;

      try {
        const res = await API.get(`/api/cases/${encodeURIComponent(caseId)}/ai-insights`);
        if (isMounted) setAi(res);
      } catch (err) {
        if (isMounted) setError(err.message);
      } finally {
        if (isMounted) setLoading(false);
      }
    }
    fetchAi();
    return () => { isMounted = false; };

  const riskColor = ai?.risk_level === 'CRITICAL' ? '#f43f5e' : (ai?.risk_level === 'HIGH' ? '#f59e0b' : '#10b981');

          <div style={{display:'flex', alignItems:'center', gap:'8px'}}>

              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" strokeWidth="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
              AI Case Intelligence Dossier

            <span className="tag open" style={{background:'rgba(0, 210, 255, 0.15)', color:'var(--accent)', borderColor:'rgba(0, 210, 255, 0.3)', fontSize:'11px'}}>AI Engine</span>
          </div>
          <div style={{fontSize:'13px', color:'var(--text-dim)', marginTop:'3px'}}>{esc(caseName || caseId)} (<span className="mono">{esc(caseId)}</span>)</div>
        </div>
        <button className="neu-btn ghost" onClick={onClose} style={{padding:'4px 8px'}}>✕</button>
      </div>

      {loading ? (
        <div style={{padding:'40px 20px', textAlign:'center', display:'flex', flexDirection:'column', alignItems:'center', gap:'12px'}}>
          <div className="status-dot" style={{width:'16px', height:'16px', background:'var(--accent)', animation:'pulse 1s infinite'}}></div>
          <div style={{fontWeight:600, fontSize:'14px'}}>Synthesizing forensic intelligence with AI Engine…</div>
          <div style={{fontSize:'12.5px', color:'var(--text-faint)'}}>Correlating suspects, transaction chains, and graph anomalies from Neo4j</div>
        </div>
      ) : error ? (
        <div className="empty" style={{color:'var(--red)'}}>Failed to generate AI insights: {error}</div>
      ) : (
        <div>
          <div style={{display:'flex', gap:'10px', marginBottom:'16px', alignItems:'center', background:'var(--bg1)', padding:'10px 14px', borderRadius:'10px', border:'1px solid var(--border)', flexWrap:'wrap'}}>
            <span className="tag" style={{background:`${riskColor}22`, color: riskColor, border:`1px solid ${riskColor}44`, fontWeight:700}}>
              RISK LEVEL: {esc(ai.risk_level)}
            </span>
            <div style={{fontSize:'12px', color:'var(--text-faint)', flex:1, textAlign:'right'}}>
              Analyzed by <b>{esc(ai.ai_model)}</b> · Live Neo4j Sync
            </div>
          </div>

          <div style={{marginBottom:'16px'}}>
            <div style={{fontWeight:700, fontSize:'13.5px', marginBottom:'6px', color:'var(--text)'}}>Executive Forensic Summary</div>
            <div style={{fontSize:'13px', lineHeight:1.6, color:'var(--text)', background:'var(--surface)', padding:'12px', borderRadius:'8px', border:'1px solid var(--border)'}}>
              {esc(ai.executive_summary)}

          {ai.modus_operandi && (
            <div style={{marginBottom:'16px'}}>

                {esc(ai.modus_operandi)}

          <div className="cards-grid" style={{gridTemplateColumns: '1fr 1fr', gap:'14px', marginBottom:'16px'}}>

                {(ai.investigative_leads || []).map((l, idx) => <li key={idx} style={{marginBottom:'8px', fontWeight:500}}>{esc(l)}</li>)}
              </ol>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ResetDbConfirmContent({ onClose, addToast, onSuccess }) {
  const [wiping, setWiping] = useState(false);
  const handleExecute = async () => {
    setWiping(true);
    try {
      const res = await API.delete('/api/cases/reset?confirm=true');
      onClose();
      addToast(res.message || 'Graph database cleared.', 'ok');
      onSuccess();
    } catch (e) {
      addToast(`Database reset failed: ${e.message}`, 'err');
      setWiping(false);
    }
  };

  return (
    <div className="confirm-box">
      <div className="confirm-header">
        <svg viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <div className="confirm-title" style={{color:'var(--danger)'}}>Reset Entire Graph Database?</div>
      </div>
      <div className="confirm-body">
        This operation executes a complete database wipe (<span className="mono">MATCH (n) DETACH DELETE n</span>).
        <br/><br/>
        <b style={{color:'var(--red)'}}>All cases, persons, phones, accounts, vehicles, and forensic logs will be permanently deleted.</b>
        This action cannot be undone.
      </div>
      <div className="confirm-actions">
        <button className="neu-btn ghost" onClick={onClose}>Cancel</button>
        <button className="neu-btn danger" disabled={wiping} onClick={handleExecute}>
          {wiping ? 'Wiping database…' : 'Yes, Wipe Everything'}
        </button>
      </div>
    </div>
  );
}

function DeleteCaseConfirmContent({ caseId, caseName, onClose, addToast, onSuccess }) {
  const [deleting, setDeleting] = useState(false);
  const handleExecute = async () => {
    setDeleting(true);
    try {
      const res = await API.delete(`/api/cases/${encodeURIComponent(caseId)}?confirm=true`);
      onClose();
      addToast(`Case ${caseId} deleted: ${res.nodes_removed} nodes removed, ${res.nodes_detached} shared nodes preserved.`, 'ok');
      onSuccess();
    } catch (e) {
      addToast(`Failed to delete case: ${e.message}`, 'err');
      setDeleting(false);
    }
  };

  return (
    <div className="confirm-box">
      <div className="confirm-header">
        <svg viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <div className="confirm-title">Confirm Case Deletion</div>
      </div>
      <div className="confirm-body">
        Are you sure you want to permanently delete case <b style={{color:'var(--text)'}}>{esc(caseName || caseId)}</b> (<span className="mono">{esc(caseId)}</span>)?
        <br/><br/>
        <b style={{color:'var(--amber)'}}>Integrity Preservation:</b>
        <ul style={{margin:'8px 0 0 18px', fontSize:'13px', lineHeight:1.6}}>
          <li>Entities exclusively owned by this case will be permanently removed.</li>
          <li>Entities shared with other cases will be <b>preserved</b> (only unlinked from this case).</li>
          <li>All case-specific communication and transaction relationships will be purged.</li>
        </ul>
      </div>
      <div className="confirm-actions">
        <button className="neu-btn ghost" onClick={onClose}>Cancel</button>
        <button className="neu-btn danger" disabled={deleting} onClick={handleExecute}>
          {deleting ? 'Deleting…' : 'Confirm & Delete Case'}
        </button>
      </div>
    </div>
  );
}
